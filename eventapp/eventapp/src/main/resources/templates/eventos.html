<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Catalogo de eventos</h1>
            <p class="text-muted mb-0">
                Total: <span class="badge bg-primary" th:text="${eventos.size()}">0</span>
                <span th:if="${filtro != null}" class="ms-2" th:text="${filtro}">Filtro</span>
            </p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:if="${filtro != null}" th:href="@{/eventos}">
                Quitar filtro
            </a>
            <a class="btn btn-primary" th:href="@{/eventos/nuevo}">
                <i class="bi bi-plus-lg me-1"></i>Nuevo evento
            </a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="e : ${eventos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <a class="badge bg-secondary text-decoration-none"
                           th:href="@{/eventos/categoria/{categoria}(categoria=${e.categoria})}"
                           th:text="${e.categoria}">categoria</a>
                        <small class="text-muted" th:text="${e.fecha}">2026-08-01</small>
                    </div>
                    <h5 class="card-title" th:text="${e.nombre}">Nombre del evento</h5>
                    <p class="text-muted small flex-grow-1" th:text="${e.descripcion}">
                        Descripcion breve del evento.
                    </p>
                    <div class="small text-muted mb-2">
                        <i class="bi bi-geo-alt me-1"></i><span th:text="${e.lugar}">Lugar</span>
                    </div>
                    <div class="small mb-3">
                        <span class="fw-bold" th:text="${e.cuposVendidos} + ' / ' + ${e.cupoMaximo}">0/0</span>
                        cupos
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-auto">
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/eventos/{id}(id=${e.id})}">
                            <i class="bi bi-eye me-1"></i>Ver
                        </a>
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/eventos/{id}/editar(id=${e.id})}">
                            <i class="bi bi-pencil-square me-1"></i>Editar
                        </a>
                        <button type="button"
                                class="btn btn-outline-danger btn-sm"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminar"
                                th:attr="data-id=${e.id}, data-nombre=${e.nombre}">
                            <i class="bi bi-trash me-1"></i>Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-warning mt-4" th:if="${eventos.isEmpty()}">
        <i class="bi bi-exclamation-triangle me-2"></i>
        No hay eventos para mostrar.
    </div>

</main>

<div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEliminarLabel">Eliminar evento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">
                    Seguro que queres eliminar
                    <strong id="nombreEventoEliminar">este evento</strong>?
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formEliminar" method="post">
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modalEliminar = document.getElementById('modalEliminar');

    if (modalEliminar) {
        modalEliminar.addEventListener('show.bs.modal', function (event) {
            const boton = event.relatedTarget;
            const id = boton.getAttribute('data-id');
            const nombre = boton.getAttribute('data-nombre');

            document.getElementById('nombreEventoEliminar').textContent = nombre;
            document.getElementById('formEliminar').setAttribute('action', `/eventos/${id}/eliminar`);
        });
    }
</script>
</body>
</html>
