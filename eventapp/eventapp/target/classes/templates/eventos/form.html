<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | EventApp'">Formulario | EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4" style="max-width: 760px;">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/eventos}">Eventos</a></li>
            <li class="breadcrumb-item active" th:text="${titulo}">Formulario</li>
        </ol>
    </nav>

    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3 mb-4" th:text="${titulo}">Nuevo evento</h1>

            <form th:action="${evento.id == null} ? @{/eventos} : @{/eventos/{id}(id=${evento.id})}"
                  th:object="${evento}"
                  method="post"
                  novalidate>

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" type="text" class="form-control" th:field="*{nombre}"
                           th:errorclass="is-invalid" placeholder="Ej: Taller de Spring Boot">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripcion</label>
                    <textarea id="descripcion" class="form-control" rows="3" th:field="*{descripcion}"
                              th:errorclass="is-invalid" placeholder="Descripcion corta del evento"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input id="fecha" type="date" class="form-control" th:field="*{fecha}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="categoria" class="form-label">Categoria</label>
                        <input id="categoria" type="text" class="form-control" th:field="*{categoria}"
                               th:errorclass="is-invalid" placeholder="Ej: Taller">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="lugar" class="form-label">Lugar</label>
                        <input id="lugar" type="text" class="form-control" th:field="*{lugar}"
                               th:errorclass="is-invalid" placeholder="Ej: Aula 301">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lugar')}" th:errors="*{lugar}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="organizador" class="form-label">Organizador</label>
                        <input id="organizador" type="text" class="form-control" th:field="*{organizador}"
                               th:errorclass="is-invalid" placeholder="Ej: Universidad Fidelitas">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('organizador')}" th:errors="*{organizador}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="cupoMaximo" class="form-label">Cupo maximo</label>
                        <input id="cupoMaximo" type="number" min="1" class="form-control" th:field="*{cupoMaximo}"
                               th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cupoMaximo')}" th:errors="*{cupoMaximo}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="cuposVendidos" class="form-label">Cupos vendidos</label>
                        <input id="cuposVendidos" type="number" min="0" class="form-control" th:field="*{cuposVendidos}"
                               th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cuposVendidos')}" th:errors="*{cuposVendidos}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="precio" class="form-label">Precio</label>
                        <input id="precio" type="number" min="0" step="0.01" class="form-control" th:field="*{precio}"
                               th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a class="btn btn-secondary" th:href="@{/eventos}">Cancelar</a>
                    <button type="submit" class="btn btn-primary" th:text="${textoBoton}">Guardar</button>
                </div>
            </form>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
