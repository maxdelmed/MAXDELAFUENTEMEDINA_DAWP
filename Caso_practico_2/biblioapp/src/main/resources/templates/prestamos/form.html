<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Nuevo prestamo')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<div class="container" style="max-width: 700px;">
    <h2 class="mb-4">Registrar prestamo</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/prestamos/guardar}" method="post">
        <div class="mb-3">
            <label class="form-label">Libro</label>
            <select name="libroId" class="form-select" required>
                <option value="">Seleccione</option>
                <option th:each="libro : ${libros}"
                        th:if="${libro.copiasDisponibles > 0}"
                        th:value="${libro.id}"
                        th:text="${libro.titulo + ' - ' + libro.copiasDisponibles + ' disponibles'}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Lector</label>
            <select name="usuarioId" class="form-select" required>
                <option value="">Seleccione</option>
                <option th:each="usuario : ${usuarios}"
                        th:value="${usuario.id}"
                        th:text="${usuario.nombreCompleto + ' (' + usuario.username + ')'}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Registrar</button>
        <a href="/prestamos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
