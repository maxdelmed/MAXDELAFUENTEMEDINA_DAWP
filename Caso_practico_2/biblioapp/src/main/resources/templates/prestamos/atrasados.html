<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Prestamos atrasados')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<div class="container">
    <h2 class="mb-4">Prestamos atrasados</h2>

    <div th:if="${#lists.isEmpty(prestamos)}" class="alert alert-success">
        No hay prestamos atrasados.
    </div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(prestamos)}">
        <table class="table table-danger table-striped">
            <thead>
            <tr>
                <th>Libro</th>
                <th>Lector</th>
                <th>Fecha prestamo</th>
                <th>Fecha limite</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prestamo : ${prestamos}">
                <td th:text="${prestamo.libro.titulo}"></td>
                <td th:text="${prestamo.usuario.nombreCompleto}"></td>
                <td th:text="${prestamo.fechaPrestamo}"></td>
                <td th:text="${prestamo.fechaLimite}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
